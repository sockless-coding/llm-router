name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Windows-only: LR.Core depends on System.Management and the app hosts as a
    # Windows Service, so the product is only meaningfully built/tested on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LR.Application/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore LR.slnx

      - name: Build frontend CSS
        working-directory: LR.Application
        run: |
          npm ci
          npm run build:css

      - name: Build
        run: dotnet build LR.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test LR.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: warn
